services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caoa-venda-cantada-backend
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlserver}
      DATABASE_URL: "${DATABASE_URL}"
      PORT: 4000
      TLS_ENABLED: "false"
      NODE_ENV: production
    command: sh -c "pnpm prisma:migrate:deploy && node dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.web
    container_name: caoa-venda-cantada-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
      TLS_ENABLED: "false"
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3003"

  nginx:
    image: nginx:1.27-alpine
    container_name: caoa-venda-cantada-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates are intentionally not versioned. See deploy/certs/README.md.
      - ./deploy/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./deploy/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O - https://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
